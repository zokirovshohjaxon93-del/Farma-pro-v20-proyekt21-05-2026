<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF3F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FarmaPro">
<meta name="description" content="Tibbiy vakil uchun: kontaktlar, qarzlar, dorilar, tashriflar">
<title>FarmaPro</title>
<meta property="og:type" content="website">
<meta property="og:title" content="FarmaPro">
<meta property="og:description" content="Kontaktlar, qarzlar, dorilar va tashriflar bitta ilovada">
<meta property="og:image" content="og-image.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F1;--surface:#FFFFFF;--surface2:#F5F8F7;--line:#D6E1DD;--line2:#C3D2CC;
  --ink:#13251F;--ink2:#4A5E57;--ink3:#7D8F89;
  --brand:#0B6E5A;--brand2:#095847;--brand-ink:#FFFFFF;--brand-soft:#DCEEE8;
  --amber:#9A5B00;--amber-soft:#FBEED6;
  --red:#B42318;--red-soft:#FBE3E0;
  --blue:#1F5FA8;--blue-soft:#E0EBF8;
  --violet:#6440C2;--violet-soft:#ECE6FA;
  --shadow:0 1px 2px rgba(19,37,31,.06),0 4px 14px rgba(19,37,31,.06);
  --sheet-shadow:0 -8px 40px rgba(19,37,31,.18);
  --font:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --nav-h:62px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0C1614;--surface:#13201D;--surface2:#182824;--line:#243833;--line2:#2F4842;
  --ink:#E4EFEB;--ink2:#A6BAB3;--ink3:#708680;
  --brand:#3DBE9A;--brand2:#2FA585;--brand-ink:#04201A;--brand-soft:rgba(61,190,154,.14);
  --amber:#E9A93A;--amber-soft:rgba(233,169,58,.14);
  --red:#F07A6E;--red-soft:rgba(240,122,110,.14);
  --blue:#77AEEB;--blue-soft:rgba(119,174,235,.14);
  --violet:#B39BF2;--violet-soft:rgba(179,155,242,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3);--sheet-shadow:0 -8px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0C1614;--surface:#13201D;--surface2:#182824;--line:#243833;--line2:#2F4842;
    --ink:#E4EFEB;--ink2:#A6BAB3;--ink3:#708680;
    --brand:#3DBE9A;--brand2:#2FA585;--brand-ink:#04201A;--brand-soft:rgba(61,190,154,.14);
    --amber:#E9A93A;--amber-soft:rgba(233,169,58,.14);
    --red:#F07A6E;--red-soft:rgba(240,122,110,.14);
    --blue:#77AEEB;--blue-soft:rgba(119,174,235,.14);
    --violet:#B39BF2;--violet-soft:rgba(179,155,242,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3);--sheet-shadow:0 -8px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--brand)}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── App shell ── */
#app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(var(--sat) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.2px}
.brand-mark{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center;flex:none}
.brand-mark svg{width:14px;height:14px;fill:var(--brand-ink)}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.3px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:none;position:relative}
.icon-btn:hover{background:var(--surface2)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sync-dot{position:absolute;right:7px;top:7px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);background:var(--ink3)}
.sync-dot.ok{background:var(--brand)}.sync-dot.busy{background:var(--amber);animation:pulse 1s infinite}.sync-dot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
main#view{flex:1;padding:4px 16px calc(var(--nav-h) + var(--sab) + 90px);max-width:1100px;width:100%;margin:0 auto}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:0 4px var(--sab);height:calc(var(--nav-h) + var(--sab))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink3);position:relative}
.bnav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav button.on{color:var(--brand)}
.bnav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.bnav .badge-dot{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--sab) + 18px);z-index:35;height:54px;min-width:54px;padding:0 20px;border-radius:18px;background:var(--brand);color:var(--brand-ink);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(11,110,90,.35)}
.fab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}

.nav-brand{display:none;padding:4px 14px 18px}
.more-only{display:none!important}
@media (min-width:900px){
  #app{flex-direction:row}
  .bnav{position:sticky;top:0;flex-direction:column;justify-content:flex-start;width:220px;height:100vh;border-top:0;border-right:1px solid var(--line);padding:20px 10px;gap:2px;bottom:auto}
  .bnav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:12px;font-size:14px}
  .bnav button.on{background:var(--brand-soft)}
  .bnav button.on::before{display:none}
  .bnav .badge-dot{position:static;margin-left:auto}
  .bnav .nav-brand{display:flex!important}
  .appcol{flex:1;min-width:0;display:flex;flex-direction:column}
  .fab{bottom:28px;right:32px}
  main#view{padding-bottom:110px}
  .more-only{display:flex!important}
  .mob-only{display:none!important}
}

/* ── Content primitives ── */
.section{margin-top:18px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
.section-h h2{font-size:15px;font-weight:650;color:var(--ink2)}
.section-h .link{font-size:13px;color:var(--brand);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.list{display:flex;flex-direction:column;gap:8px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%;position:relative}
button.item:active{background:var(--surface2)}
.item .body{flex:1;min-width:0;display:block}
.item .t,.item .s{display:block}
.item .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;flex:none}
.item .r .v{font-weight:650;font-variant-numeric:tabular-nums}
.item .r .s{font-size:12px}
.item.sel{border-color:var(--brand);background:var(--brand-soft)}
.item .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.item.sel .chk{background:var(--brand);border-color:var(--brand)}
.item.sel .chk::after{content:"";width:6px;height:11px;border:solid var(--brand-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:16px;overflow:hidden;background:var(--brand-soft);color:var(--brand)}
.av.ph{background:var(--blue-soft);color:var(--blue)}
.av img{width:100%;height:100%;object-fit:cover}
.av.sq{border-radius:12px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.tag.green{background:var(--brand-soft);color:var(--brand)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.violet{background:var(--violet-soft);color:var(--violet)}
.c-red{color:var(--red)}.c-amber{color:var(--amber)}.c-green{color:var(--brand)}.c-blue{color:var(--blue)}.c-violet{color:var(--violet)}.c-mute{color:var(--ink3)}
.muted{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.empty{text-align:center;padding:36px 16px;color:var(--ink2)}
.empty .e-i{font-size:34px;margin-bottom:8px}
.empty .btn{margin-top:14px}

/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;margin:8px 0 10px}
.toolbar .btn{padding:0 12px;flex:none}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search svg{width:18px;height:18px;stroke:var(--ink3);fill:none;stroke-width:2;flex:none}
.search input{border:0;background:none;outline:none;flex:1;height:100%;min-width:0;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:550;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px}

/* buttons */
.btn{height:44px;padding:0 18px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{background:var(--red-soft);border-color:transparent;color:var(--red)}
.btn.ghost{background:none;border-color:transparent;color:var(--brand)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row>.btn{flex:1}
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.det-head~.actions,.sheet .actions{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.act{text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:550;color:var(--ink2);text-align:center}
.act .i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--brand-soft)}

/* home */
.hero{padding:18px 18px 16px;border-radius:20px;background:var(--brand);color:var(--brand-ink);position:relative;overflow:hidden}
.hero .d{font-size:13px;opacity:.85}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.8px;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.hero .row{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.hero .row b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.hero .cross{position:absolute;right:-26px;top:-26px;width:140px;height:140px;opacity:.12}
.agenda .item{border-left:4px solid var(--line2)}
.agenda .item.red{border-left-color:var(--red)}
.agenda .item.amber{border-left-color:var(--amber)}
.agenda .item.green{border-left-color:var(--brand)}
.agenda .item.blue{border-left-color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .k{font-size:12.5px;color:var(--ink2)}
.stat .v{font-size:20px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .x{font-size:12px;color:var(--ink3)}

/* ── Layers: sheets & dialogs ── */
#layers{position:relative;z-index:100}
.scrim{position:fixed;inset:0;background:rgba(8,20,16,.45);opacity:0;transition:opacity .2s}
.layer.in .scrim{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--sheet-shadow);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.layer.in .sheet{transform:none}
.sheet.full{height:92vh;height:92dvh}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(620px,94vw);max-height:88vh;border-radius:20px;transform:translate(-50%,-46%);opacity:0;transition:transform .2s,opacity .2s}
  .layer.in .sheet{transform:translate(-50%,-50%);opacity:1}
  .sheet.full{height:auto;min-height:60vh}
  .sheet.wide{width:min(900px,94vw)}
}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 18px;border-bottom:1px solid var(--line)}
.sheet-h h3{flex:1;font-size:17px;font-weight:700;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grab{position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--line2)}
@media (min-width:700px){.grab{display:none}}
.sheet-b{padding:14px 18px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sheet-f{padding:10px 18px calc(12px + var(--sab));border-top:1px solid var(--line);display:flex;gap:8px;background:var(--surface)}
.sheet-f .btn{flex:1}

/* forms */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 2}
.f.half{grid-column:span 1}
.f>label,.f .lbl{font-size:13px;font-weight:550;color:var(--ink2)}
.f .req{color:var(--red)}
.f .hint{font-size:12px;color:var(--ink3)}
.inp{height:46px;padding:0 13px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);outline:none;width:100%;font-size:16px}
textarea.inp{height:auto;min-height:76px;padding:11px 13px;resize:vertical}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.inp.err{border-color:var(--red)}
.inp-group{display:flex;gap:6px}
.inp-group .inp{flex:1}
.picker{height:46px;padding:0 13px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.picker .ph{color:var(--ink3)}
.picker .pv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-sec{grid-column:span 2;font-weight:650;font-size:14px;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
.switch{display:flex;align-items:center;gap:12px;padding:6px 0;cursor:pointer}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .tr{width:44px;height:26px;border-radius:13px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.switch .tr::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.tr{background:var(--brand)}
.switch input:checked+.tr::after{transform:translateX(18px)}
.switch .sl{flex:1}
.imgpick{display:flex;align-items:center;gap:12px}
.imgpick .prev{width:72px;height:72px;border-radius:14px;background:var(--surface2);border:1px dashed var(--line2);display:grid;place-items:center;overflow:hidden;flex:none;font-size:24px;color:var(--ink3)}
.imgpick .prev img{width:100%;height:100%;object-fit:cover}
.loc-box{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.loc-box .coords{font-size:13px;color:var(--ink2)}

/* detail */
.det-head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.det-head .av{width:64px;height:64px;font-size:22px}
.det-head h4{font-size:19px;font-weight:700;letter-spacing:-.3px}
.kv{display:flex;flex-direction:column}
.kv>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv>div:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{text-align:right;font-weight:550;overflow-wrap:anywhere}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;margin:10px 0}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl>div{position:relative;padding:6px 0 10px}
.tl>div::before{content:"";position:absolute;left:-17px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}

/* toasts / banners */
#toasts{position:fixed;left:0;right:0;top:calc(var(--sat) + 8px);z-index:300;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{max-width:460px;width:100%;background:var(--ink);color:var(--surface);padding:11px 14px;border-radius:13px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;pointer-events:auto;animation:tin .22s ease-out}
.toast-act{color:var(--brand);font-weight:700;padding:0 4px;white-space:nowrap;font-size:14px}
:root[data-theme=dark] .toast-act{color:var(--brand2)}
.toast.err{background:var(--red);color:#fff}
.toast.ok .ti{color:var(--brand)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.banner{position:sticky;top:0;z-index:50;padding:10px 16px;font-size:13.5px;font-weight:550;display:flex;gap:10px;align-items:center}
.banner.err{background:var(--red);color:#fff}
.banner.warn{background:var(--amber-soft);color:var(--amber)}
.banner .btn{height:32px;font-size:13px}

/* lock / setup */
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(var(--sat) + 24px)}
.lock-box{width:100%;max-width:380px}
.lock-box .brand{font-size:24px;margin-bottom:6px}
.lock-box .brand-mark{width:38px;height:38px;border-radius:11px}
.lock-box .brand-mark svg{width:20px;height:20px}
.lock-box p{color:var(--ink2);margin-bottom:22px}
.lock-box .f{margin-bottom:12px}

/* map */
.map{height:340px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);position:relative}
.map.tall{height:calc(100vh - 260px);min-height:320px}
.map-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--ink2);font-size:14px}
.leaflet-container{font:inherit!important}
.mk{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk.v{background:#0B6E5A}.mk.d{background:#1F5FA8}.mk.me{background:#B42318;border-radius:50%;transform:none;width:18px;height:18px}

/* charts */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* print preview */
#printView{position:fixed;inset:0;z-index:250;background:#fff;color:#13251F;overflow:auto;-webkit-overflow-scrolling:touch}
#printView .pv-bar{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:calc(var(--sat) + 8px) 12px 8px;background:#EEF3F1;border-bottom:1px solid #D6E1DD;color:#13251F}
#printView .pv-bar .btn{background:#fff;color:#13251F;border-color:#C3D2CC}#printView .pv-bar .btn.primary{background:#0B6E5A;color:#fff;border-color:#0B6E5A}
#printView .pv-doc{padding:18px;max-width:900px;margin:0 auto;overflow-x:auto}
body.pv-open{overflow:hidden}
@media print{
  body.pv-open>*:not(#printView){display:none!important}
  body.pv-open{overflow:visible;background:#fff}
  #printView{position:static;overflow:visible}
  #printView .pv-bar{display:none}
  #printView .pv-doc{padding:0;max-width:none}
  @page{margin:14mm}
}

/* vCard 2.1 / 3.0 / 4.0 parser (handles folded lines, quoted-printable, photos) */
function parseVCF(text) {
    text = String(text || '').replace(/\r\n?/g, '\n');
    const raw = text.split('\n'), lines = [];
    for (let i = 0; i < raw.length; i++) {
        let l = raw[i];
        if (/^[ \t]/.test(l) && lines.length) {
            lines[lines.length - 1] += l.replace(/^[ \t]/, '');
            continue;
        }
        if (/QUOTED-PRINTABLE/i.test(l.split(':')[0] || '')) {
            while (l.endsWith('=') && i + 1 < raw.length)
                l = l.slice(0, -1) + raw[++i];
        }
        lines.push(l);
    }
    const qp = (s, cs) => {
        const bytes = [];
        for (let i = 0; i < s.length; i++) {
            if (s[i] === '=' && /^[0-9A-F]{2}$/i.test(s.substr(i + 1, 2))) {
                bytes.push(parseInt(s.substr(i + 1, 2), 16));
                i += 2;
            }
            else
                bytes.push(s.charCodeAt(i) & 255);
        }
        try {
            return new TextDecoder(cs || 'utf-8').decode(new Uint8Array(bytes));
        }
        catch (_a) {
            return new TextDecoder().decode(new Uint8Array(bytes));
        }
    };
    const unesc = s => s.replace(/\\n/gi, '\n').replace(/\\([,;\\])/g, '$1');
    const out = [];
    let cur = null;
    for (const l of lines) {
        if (/^BEGIN:VCARD/i.test(l)) {
            cur = { tels: [] };
            continue;
        }
        if (/^END:VCARD/i.test(l)) {
            if (cur) {
                let name = cur.fn || (cur.n ? [cur.n[1], cur.n[2], cur.n[0]].filter(Boolean).join(' ') : '') || cur.org || '';
                out.push({ name: name.trim(), phone: cur.tels[0] || '', phone2: cur.tels[1] || '', spec: cur.title || '', workplace: cur.org || '', address: cur.adr || '', note: cur.note || '', birthday: cur.bday || '', photo: cur.photo || null });
            }
            cur = null;
            continue;
        }
        if (!cur)
            continue;
        const ci = l.indexOf(':');
        if (ci < 0)
            continue;
        const head = l.slice(0, ci), val = l.slice(ci + 1);
        const parts = head.split(';');
        const prop = parts[0].split('.').pop().toUpperCase();
        const params = parts.slice(1).join(';').toUpperCase();
        const cs = (params.match(/CHARSET=([\w-]+)/) || [])[1];
        let v = /QUOTED-PRINTABLE/.test(params) ? qp(val, cs) : val;
        if (prop === 'FN')
            cur.fn = unesc(v);
        else if (prop === 'N')
            cur.n = v.split(';').map(unesc);
        else if (prop === 'TEL') {
            const p = normPhone(v.replace(/^tel:/i, ''));
            if (p && !cur.tels.includes(p))
                cur.tels.push(p);
        }
        else if (prop === 'ORG')
            cur.org = unesc(v.split(';').filter(Boolean).join(', '));
        else if (prop === 'TITLE' || prop === 'ROLE')
            cur.title = cur.title || unesc(v);
        else if (prop === 'NOTE')
            cur.note = unesc(v);
        else if (prop === 'ADR')
            cur.adr = cur.adr || unesc(v.split(';').filter(Boolean).join(', '));
        else if (prop === 'BDAY') {
            const d = parseAnyDate(v.replace(/^--/, '2000-'));
            if (d)
                cur.bday = d;
        }
        else if (prop === 'PHOTO') {
            if (/^data:image/i.test(val))
                cur.photo = val;
            else if (/ENCODING=(B|BASE64)|BASE64/.test(params)) {
                const t = (params.match(/TYPE=(\w+)/) || [, ''])[1] || (params.match(/;(JPEG|PNG|GIF)/) || [, 'JPEG'])[1];
                cur.photo = `data:image/${(t || 'jpeg').toLowerCase().replace('jpg', 'jpeg')};base64,${val.replace(/\s/g, '')}`;
            }
        }
    }
    return out;
}

        window.addEventListener('online', () => { UI.banner('net', null); if (Sync.on())
            Sync.sync({ silent: true }); });
        window.addEventListener('offline', () => UI.banner('net', 'Internet yo\'q — ishlashda davom eting, o\'zgarishlar telefonda saqlanadi.', 'warn'));
        if (!navigator.onLine)
            UI.banner('net', 'Internet yo\'q — ishlashda davom eting, o\'zgarishlar telefonda saqlanadi.', 'warn');
        try {
            if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted()))
                await navigator.storage.persist();
        }
        catch (_d) { }
        const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
        if (ios && !standalone && !SETS.iosHintShown) {
            UI.banner('ios', 'iPhone\'da ma\'lumot o\'chib ketmasligi uchun: Safari → Ulashish ⬆️ → "Uy ekraniga qo\'shish".', 'warn', { label: 'Tushundim', fn: () => { SETS.iosHintShown = true; saveSets(); UI.banner('ios', null); } });
        }
        if (!Sync.on() && COLS.reduce((s, c) => s + DB[c].length, 0) > 20 && !SETS.syncHintDay || (!Sync.on() && SETS.syncHintDay && dLeft(SETS.syncHintDay) < -14)) {
            SETS.syncHintDay = today();
            saveSets();
            UI.banner('synchint', 'Ma\'lumotlaringiz faqat shu telefonda. Yo\'qolmasligi uchun sinxronni yoqing.', 'warn', { label: 'Yoqish', fn: () => { UI.banner('synchint', null); Router.go('settings'); } });
        }
    }
    catch (e) {
        console.error(e);
        showFatal(e);
    }
}
function showFatal(e) {
    const b = $('#boot') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'boot' }));
    b.hidden = false;
    b.style.cssText = 'padding:24px;font-family:system-ui';
    b.innerHTML = `<h3>Ilovani ishga tushirishda xato</h3><p style="margin:8px 0">${esc(e && e.message || e)}</p><p>Sahifani yangilang. Takrorlansa, bu xabarning rasmini yuboring.</p><button onclick="location.reload()" style="margin-top:12px;padding:10px 16px">Yangilash</button>`;
}
/* Show only OUR errors. "Script error." = foreign script (browser add-ons, Edge/Copilot, CDN) — not actionable */
function ownError(e) {
    const m = String(e && e.message || '');
    if (!m || /^Script error\.?$/i.test(m))
        return false;
    if (e.filename) {
        try {
            if (new URL(e.filename, location.href).origin !== location.origin)
                return false;
        }
        catch (_a) {
            return false;
        }
    }
    return true;
}
window.addEventListener('error', e => { console.error(e.error || e.message); if (!ownError(e) || !$('#app') || $('#app').hidden)
    return; UI.toast('Kutilmagan xato: ' + e.message, 'err'); });
window.addEventListener('unhandledrejection', e => { console.error(e.reason); const m = (e.reason && e.reason.message) || ''; if (!m || /Script error|AbortError|NotAllowedError/i.test(m + (e.reason && e.reason.name || '')))
    return; if ($('#app') && !$('#app').hidden)
    UI.toast('Xato: ' + m, 'err'); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window._installPrompt = e; });
try {
    if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
        window.addEventListener('load', () => {
            try {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller)
                        UI.banner('upd', 'Yangi versiya tayyor.', 'warn', { label: 'Yangilash', fn: () => { flush().then(() => location.reload()); } }); }); });
                }).catch(() => { });
            }
            catch (e) { }
        });
    }
}
catch (e) { /* sandbox: no service worker */ }
boot();
